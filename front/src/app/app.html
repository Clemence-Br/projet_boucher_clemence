<header class="navbar">
  <a class="brand" routerLink="/">
    <span class="brand-logo">🌱</span>
    <span>
      BinThere
      <small>Recensement et gestion des pollutions</small>
    </span>
  </a>

  @if (session.user(); as user) {
    <nav class="nav-links">
      <a routerLink="/pollutions" routerLinkActive="active">Pollutions</a>
      <a routerLink="/utilisateurs" routerLinkActive="active">Utilisateurs</a>
    </nav>

    <div class="session">
      <span class="session-name">{{ user.prenom }} {{ user.nom }}</span>
      <button type="button" class="logout" (click)="logout()">Déconnexion</button>
    </div>
  }
</header>

<main>
  <div class="card">
    <div class="card-body">
      <router-outlet />
    </div>
  </div>
</main>
